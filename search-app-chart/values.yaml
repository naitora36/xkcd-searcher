postgresql:
  enabled: true
  fullnameOverride: "postgres"
  auth:
    username: "postgres"
    postgresPassword: "password"
    database: "postgres"
  primary:
    persistence:
      enabled: true
      size: 1Gi 

microservices:
  api:
    image: "api"    
    ports:
      - name: http
        containerPort: 8080
        protocol: TCP
    metrics:            
      portName: "http"
    env:
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "password"
      TOKEN_TTL: "2m"
      API_ADDRESS: ":8080"
      WORDS_ADDRESS: "words:8080"
      UPDATE_ADDRESS: "update:8080"
      SEARCH_ADDRESS: "search:8080"
      ISEARCH_ADDRESS: "isearch:8080"
      SEARCH_CONCURRENCY: "10"
      SEARCH_RATE: "100"
      RATE_TIMEOUT_QUEUE: "30s"

  words:
    image: "words"
    ports:
      - name: grpc
        containerPort: 8080
        protocol: TCP
    env:
      WORDS_ADDRESS: ":8080"

  update:
    image: "update"
    ports:
      - name: grpc
        containerPort: 8080
        protocol: TCP
    waitForDb: true
    env:
      UPDATE_ADDRESS: ":8080"
      DB_ADDRESS: "postgres://postgres:password@postgres:5432/postgres"
      XKCD_URL: "https://xkcd.com"
      XKCD_CONCURRENCY: "10"
      WORDS_ADDRESS: "words:8080"
      BROKER_ADDRESS: "nats://nats:4222"

  search:
    image: "search"
    ports:
      - name: grpc
        containerPort: 8080
        protocol: TCP
    waitForDb: true
    env:
      SEARCH_ADDRESS: ":8080"
      DB_ADDRESS: "postgres://postgres:password@postgres:5432/postgres"
      WORDS_ADDRESS: "words:8080"

  isearch:
    image: "isearch"
    ports:
      - name: grpc
        containerPort: 8080
        protocol: TCP
      - name: metrics
        containerPort: 8086
        protocol: TCP
    waitForDb: true
    metrics:
      portName: "metrics"
    env:
      METRICS_SERVER_ADDRESS: ":8086"
      ISEARCH_ADDRESS: ":8080"
      DB_ADDRESS: "postgres://postgres:password@postgres:5432/postgres"
      WORDS_ADDRESS: "words:8080"
      BROKER_ADDRESS: "nats://nats:4222"
      INDEX_TTL: "24h"

  nats:
    image: nats:2.11.8-alpine 
    disableConfigMap: true
    ports:
      - name: nats
        containerPort: 4222
        protocol: TCP
      - name: monitor
        containerPort: 8222
        protocol: TCP
      - name: metrics        
        containerPort: 7777
        protocol: TCP
    metrics:
      portName: "metrics"    
    sidecars:                
      - name: nats-exporter
        image: natsio/prometheus-nats-exporter:latest
        args:
          - "-varz"
          - "-connz"
          - "http://localhost:8222"
    env:
      dummy: "value"

  pgadmin:
    image: dpage/pgadmin4
    disableConfigMap: true
    ports:
      - name: http
        containerPort: 80
        protocol: TCP
    env:
      PGADMIN_DEFAULT_EMAIL: "admin@test.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False" 
      PGADMIN_DISABLE_POSTFIX: "true"
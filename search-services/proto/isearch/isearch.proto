syntax = "proto3";

package isearch;

import "google/protobuf/empty.proto";

option go_package = "yadro.com/course/proto/isearch";

message Comic{
  int64 id = 1;
  string url = 2;
}

message SearchRequest {
  string phrase = 1;
  int64 limit = 2;
}

message SearchReply {
  repeated Comic comics = 1;
}

service ISearch {
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SearchIndex(SearchRequest) returns (SearchReply) {}
}